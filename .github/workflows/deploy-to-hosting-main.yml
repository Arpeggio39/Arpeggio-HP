name: Verify and Deploy to Firebase Hosting

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-hosting-${{ github.event_name == 'push' && 'production' || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run format:check
      - name: Lint source
        run: pnpm run lint
      - name: Check types
        run: pnpm run typecheck
      - name: Build static site
        run: pnpm run build

      - name: Deploy production site
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARPEGGIO393 }}
          firebaseToolsVersion: 15.24.0
          channelId: live
          target: arpeggio393
          projectId: arpeggio393

      - name: Send Webhook Notification
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            exit 0
          fi

          curl --fail-with-body --silent --show-error --retry 2 \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"content": "ホームページが更新されました！"}' \
            "$WEBHOOK_URL"
