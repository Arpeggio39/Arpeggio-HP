name: OSV-Scanner PR Check

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --lockfile=./package-lock.json
